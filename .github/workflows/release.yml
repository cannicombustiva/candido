name: Release

# One workflow, three ways in — not three workflows. A pushed tag publishes; the
# tagger calls this with a version it has already computed and pushed a tag for;
# workflow_dispatch rehearses. All three run the same steps: the same tests, the
# same Release build, the same packaging and every assertion below.
#
# The one deliberate difference is the version. A dry run has no tag to read one
# from, so it builds 0.0.0 — "0.0.0-dryrun" is not a valid marketing version and
# would build a bundle unlike the one a tag push produces, defeating the point of
# the rehearsal.
#
# The dry run is kept precisely because releases are now automatic: a broken edit
# to this file would otherwise be discovered by a real Release failing.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      version:
        description: The version to build and publish, without a leading v
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write

# Releases are not interchangeable the way CI runs are: a run that is midway
# through `gh release create` must not be cancelled by a later one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish
    # macos-26, not macos-26-arm64 — see the note in ci.yml. The latter is the
    # runner image's name rather than a requestable label, and asking for it
    # queues the job forever instead of failing it. macos-26 is macOS 26 on
    # arm64, so the release is still built on the declared toolchain.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Report toolchain
        run: xcodebuild -version

      # Which event fired and whether there is a tag to read are this workflow's
      # to know. What a tag means is not: scripts/version.sh owns that decision
      # and is table-tested in CI, so the number is computed in one place rather
      # than in two that can drift.
      #
      # The steps below gate on this step's `publish` output rather than on
      # github.event_name, and they have to. On a workflow_call the context is
      # the *caller's* event — event_name reads `pull_request` and
      # GITHUB_REF_NAME reads a branch — so an event_name check would upload an
      # artifact and publish nothing, silently. It also covers the older trap:
      # workflow_dispatch's ref picker offers tags, so a dry run can be started
      # from a tag ref and must still not publish.
      - name: Work out the version
        id: version
        env:
          CALLED_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          if [ -n "${CALLED_VERSION}" ]; then
            # The tagger has already computed this and pushed the matching tag.
            version="${CALLED_VERSION}"
            tag="v${version}"
            publish=true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            # A malformed tag fails here, before anything is built. The script
            # explains itself on stderr; re-raising that as an annotation keeps
            # the message where a person will see it.
            if ! version=$(scripts/version.sh from-tag "${tag}" 2>/tmp/version-error); then
              echo "::error::$(cat /tmp/version-error)"
              exit 1
            fi
            publish=true
          else
            version="0.0.0"
            tag=""
            publish=false
          fi
          if [ "${publish}" = "true" ]; then
            label="${version}"
          else
            label="0.0.0-dryrun"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version} (${label})"

      # The dmg is built from the same commit these assert against, and CLAUDE.md
      # treats the tests as the thing standing between a wrong implementation and
      # an app that merely looks fine. A release that skipped them would be the
      # one build nobody had checked.
      - name: Run the tests
        run: swift test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      # Release, not Debug. CODE_SIGN_INJECT_BASE_ENTITLEMENTS is NO on this
      # configuration, so the built app carries only what App/Candido.entitlements
      # declares — asserted below, against that file, before anything is published.
      - name: Build the app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Candido.xcodeproj \
            -scheme Candido \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            build \
            | grep -E "error:|BUILD"

      # The staging folder is what the user sees when the dmg mounts: the app,
      # and an alias to drag it onto. Plain hdiutil only — create-dmg with
      # AppleScript window styling hangs on headless runners.
      - name: Stage and package the dmg
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir staging
          cp -R DerivedData/Build/Products/Release/Candido.app staging/
          ln -s /Applications staging/Applications
          hdiutil create \
            -volname Candido \
            -srcfolder staging \
            -ov \
            -format UDZO \
            Candido.dmg
          ls -lh Candido.dmg

      # This step is the point of the workflow. Any failure here fails the run
      # before a user can download something that is not what the README
      # promises — and the Release build has never been launched by anyone, so
      # whoever downloads the dmg is its first real user.
      - name: Verify the artifact
        run: |
          set -euo pipefail
          app=DerivedData/Build/Products/Release/Candido.app

          echo "--- signature ---"
          codesign -dv "$app" 2>&1 | tee /tmp/codesign.txt
          grep -q "Signature=adhoc" /tmp/codesign.txt \
            || { echo "::error::expected an ad-hoc signature"; exit 1; }
          grep -q "runtime" /tmp/codesign.txt \
            || { echo "::error::hardened runtime flag missing"; exit 1; }

          echo "--- entitlements ---"
          # Compared as a set against App/Candido.entitlements rather than
          # against key names repeated here, so that adding a legitimate
          # entitlement is a one-file change instead of a release failure with a
          # misleading message.
          #
          # The comparison is exact in both directions, and the extra-key half is
          # the half that matters: com.apple.security.get-task-allow is what
          # would leave the shipped app attachable by a debugger, and it appears
          # by being present, not by being absent.
          codesign -d --entitlements - --xml "$app" 2>/dev/null > /tmp/built.plist
          plutil -convert json -o /tmp/built.json /tmp/built.plist
          plutil -convert json -o /tmp/declared.json App/Candido.entitlements
          python3 - <<'PY'
          import json, sys

          declared = set(json.load(open("/tmp/declared.json")))
          built = set(json.load(open("/tmp/built.json")))

          for key in sorted(declared - built):
              print(f"::error::missing entitlement {key}")
          for key in sorted(built - declared):
              print(f"::error::unexpected entitlement {key}")

          if declared != built:
              sys.exit(1)
          print(f"entitlements match the {len(declared)} declared in App/Candido.entitlements")
          PY

          echo "--- dmg contents ---"
          mountpoint=$(mktemp -d)
          hdiutil attach Candido.dmg -mountpoint "$mountpoint" -nobrowse -readonly
          trap 'hdiutil detach "$mountpoint" -force || true' EXIT
          ls -la "$mountpoint"
          [ -d "$mountpoint/Candido.app" ] \
            || { echo "::error::Candido.app missing from the dmg"; exit 1; }
          [ -L "$mountpoint/Applications" ] \
            || { echo "::error::/Applications alias missing from the dmg"; exit 1; }
          hdiutil detach "$mountpoint"
          trap - EXIT

          echo "artifact verified"

      # Dry run: no release, just something to download and open by hand.
      - name: Upload the dmg as an artifact
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Candido-dmg-${{ steps.version.outputs.label }}
          path: Candido.dmg
          if-no-files-found: error

      # The asset name is never versioned. The README's download button points
      # at /releases/latest/download/Candido.dmg, which only resolves against a
      # stable asset name.
      #
      # The tag comes from the version step, not from GITHUB_REF_NAME: on the
      # called path the ref is the caller's branch, and releasing against that
      # would name the release after main.
      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            Candido.dmg \
            --title "${TAG}" \
            --generate-notes
